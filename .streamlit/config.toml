# Configuracao do Streamlit.
# A porta e fornecida pela plataforma via --server.port $PORT no comando de
# arranque; o que fica aqui sao os valores que nao dependem do ambiente.

[server]
headless = true
address = "0.0.0.0"
port = 8501
# Uploads de ensaios, PDFs de matricula e fotos do poco: 200 MB e espacoso o
# bastante para um processo completo sem desperdicar memoria.
maxUploadSize = 200
# Nao expor o widget de "source connection" nem o menu de desenvolvimento.
runOnSave = false
# O app nao serve ficheiros estaticos proprios; desligado para evitar o aviso
# de "static folder not found" no arranque.
enableStaticServing = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f8fb"
textColor = "#1a1a1a"
font = "sans serif"

[logger]
level = "info"

[client]
# Evita que o Streamlit recarregue a pagina inteira ao editar um widget.
showErrorDetails = false
