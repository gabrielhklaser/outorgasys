name: tests

# Roda a suite em todo push na main e em todo pull request.
# Os commits automaticos de dados levam [skip ci] e nao disparam este fluxo.
# Mesmos comandos que se usa localmente (ver "Desenvolvimento e testes" no README).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (erros de sintaxe e nomes indefinidos)
        run: ruff check .

      - name: Testes unitarios e de paginas
        run: pytest --cov=outorgasys --cov-report=term-missing:skip-covered

      - name: Smoke das paginas, com processo vazio
        run: python tests/smoke_ui.py

      - name: Smoke das paginas, com o processo de exemplo
        run: python tests/smoke_exemplo.py

      - name: Auditoria de dependencias (informativa)
        # Nao reprova o fluxo: uma CVE nova em dependencia transitiva nao deve
        # travar um PR que nao tem relacao com ela. Leia o resultado no log.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off

  piso:
    # requirements.txt declara pisos (streamlit 1.49, pandas 2.1, numpy 1.26,
    # geopandas 0.14) que ninguem exercitava: o outro job instala sempre a versao
    # mais nova. Aqui as versoes minimas sao instaladas de proposito, entao um
    # piso que ja nao funciona quebra aqui e nao na maquina de alguem.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-piso.txt

      - name: Instalar os pisos declarados
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-piso.txt

      - name: Testes no piso
        # Um teste pulado e o esperado: tests/test_pagina_mapa.py exige st.iframe,
        # que so existe a partir do Streamlit 1.50 e aqui o codigo usa o fallback.
        run: pytest -q -rs
