name: tests

# Roda a suite em todo push na main e em todo pull request.
# Os commits automaticos de dados levam [skip ci] e nao disparam este fluxo.
# Mesmos comandos que se usa localmente (ver "Desenvolvimento e testes" no README).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (erros de sintaxe e nomes indefinidos)
        run: ruff check .

      - name: Testes unitarios e de paginas
        run: pytest --cov=outorgasys --cov-report=term-missing:skip-covered

      - name: Smoke das paginas, com processo vazio
        run: python tests/smoke_ui.py

      - name: Smoke das paginas, com o processo de exemplo
        run: python tests/smoke_exemplo.py

      - name: Auditoria de dependencias (informativa)
        # Nao reprova o fluxo: uma CVE nova em dependencia transitiva nao deve
        # travar um PR que nao tem relacao com ela. Leia o resultado no log.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off
